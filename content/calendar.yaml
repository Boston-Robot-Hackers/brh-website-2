# The meeting schedule: the one place to add or change a meeting.
# An entry needs only `date` and `kind` (main | handson); anything left
# out comes from `defaults`. Leave `speaker`/`topic` out until a talk is
# confirmed. Never change an existing `id`: it is the calendar-feed UID.
# Entries are kept newest first; the build sorts by date regardless.

defaults:
  location: "Artisans Asylum, 96 Holton Street, Allston"
  main:
    time: "7:00pm"
    text: "Speaker and topic to be announced."
  handson:
    time: "6:00pm"
    text: "These meetings have no agenda or speaker. Just hacking together. Beginners welcome!"
    announcement: "6-hands-on-meeting.md"

