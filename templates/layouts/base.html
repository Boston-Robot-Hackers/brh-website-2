<!-- Base layout template - Main HTML structure with navigation, banner, footer. Reusable by all pages. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var stored = localStorage.getItem('theme');
            var theme = stored ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="b8636639-c5bd-49a4-b75e-944066c5bab6"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site.title }}{% endblock %}</title>
    {% include 'components/head.html' %}
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="main-wrapper">
        {% include 'components/navigation.html' %}

        {% block banner %}{% include 'components/banner.html' %}{% endblock %}

        {% block content %}{% endblock %}
    </div>
    
    {% include 'components/footer.html' %}
    
    <script src="{{ '../' if is_detail_page else '' }}scripts/script.js"></script>
</body>
</html>
