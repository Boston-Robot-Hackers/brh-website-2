<!-- Projects listing page - Displays all projects with details. Not reusable. -->
{% extends 'layouts/page.html' %}

{% set current_page = 'projects' %}
{% set is_detail_page = false %}

{% block title %}Projects - {{ site.title }}{% endblock %}

{% block main_content %}
    <div class="row">
        <div class="col-lg-10 mx-auto" style="columns: 2; column-gap: 2rem;">
            {{ projects_content }}
        </div>
    </div>
{% endblock %}
