<!-- Meetings listing page - Displays all meetings with compact cards. -->
{% extends 'layouts/page.html' %}

{% set current_page = 'meetings' %}
{% set is_detail_page = false %}

{% block title %}Meetings - {{ site.title }}{% endblock %}

{% block main_content %}
    <h1 class="river-header">Meetings</h1>
    <p class="rail-note">All meetings at <a href="https://www.artisansasylum.com" target="_blank">Artisans Asylum, 96 Holton Street, Allston</a></p>

    <div class="meetings-controls" style="margin: 2rem 0; padding: 1rem; background: #f5f5f5; border-radius: 8px;">
        <div style="display: flex; gap: 2rem; flex-wrap: wrap; align-items: center;">
            <div>
                <label for="sort-order" style="font-weight: bold; margin-right: 0.5rem;">Sort:</label>
                <select id="sort-order" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="later-first">Later → Earlier</option>
                    <option value="earlier-first">Earlier → Later</option>
                </select>
            </div>
            <div style="display: flex; gap: 1rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="filter-upcoming" checked style="width: 18px; height: 18px;">
                    <span>Upcoming</span>
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="filter-passed" checked style="width: 18px; height: 18px;">
                    <span>Passed</span>
                </label>
            </div>
        </div>
    </div>

    <div id="meetings-container">
        {{ meetings_content }}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('meetings-container');
            const sortOrder = document.getElementById('sort-order');
            const filterUpcoming = document.getElementById('filter-upcoming');
            const filterPassed = document.getElementById('filter-passed');

            function updateMeetings() {
                const cards = container.querySelectorAll('.meeting-month-card');
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                cards.forEach(card => {
                    const dateStr = card.querySelector('.meeting-entry__line');
                    let isUpcoming = true;

                    if (dateStr) {
                        const dateText = dateStr.textContent;
                        const dateMatch = dateText.match(/(\w+)\s+(\d+),\s+(\d+)/);
                        if (dateMatch) {
                            const meetingDate = new Date(dateMatch[3], getMonthIndex(dateMatch[1]), dateMatch[2]);
                            isUpcoming = meetingDate >= today;
                        }
                    }

                    const showCard = (isUpcoming && filterUpcoming.checked) || (!isUpcoming && filterPassed.checked);
                    card.style.display = showCard ? 'block' : 'none';
                });

                // Sort by changing order in DOM
                if (sortOrder.value === 'earlier-first') {
                    const cardsArray = Array.from(container.querySelectorAll('.meeting-month-card:not([style*="display: none"])'));
                    cardsArray.reverse();
                    cardsArray.forEach(card => container.appendChild(card));
                }
            }

            function getMonthIndex(monthName) {
                const months = ['January', 'February', 'March', 'April', 'May', 'June',
                               'July', 'August', 'September', 'October', 'November', 'December'];
                return months.indexOf(monthName);
            }

            sortOrder.addEventListener('change', updateMeetings);
            filterUpcoming.addEventListener('change', updateMeetings);
            filterPassed.addEventListener('change', updateMeetings);
        });
    </script>
{% endblock %}
