<!-- Compact news card - Story-row display for listing pages. Reusable for any news listing. -->
<article class="story-row">
    {% if image %}
    <img src="{{ image }}" alt="{{ title }}" class="story-row__thumb">
    {% else %}
    <div class="story-row__thumb story-row__thumb--fallback">NEWS</div>
    {% endif %}
    <div class="story-row__body">
        <p class="story-row__meta">{{ formatted_date }}</p>
        <h3 class="story-row__title"><a href="news/{{ id }}.html">{{ title }}</a></h3>
        <p class="story-row__excerpt">{{ excerpt }}</p>
    </div>
</article>
