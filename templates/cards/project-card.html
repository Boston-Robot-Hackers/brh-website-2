<!-- Project card - Story-row display for home page project listing (thumbnail + status + title + excerpt). -->
<article class="story-row">
    {% if image %}
    <img src="{{ image }}" alt="{{ title }}" class="story-row__thumb">
    {% else %}
    <div class="story-row__thumb story-row__thumb--fallback">{{ text or 'PROJECT' }}</div>
    {% endif %}
    <div class="story-row__body">
        <p class="story-row__meta">{{ status }}</p>
        <h3 class="story-row__title"><a href="projects/{{ id }}.html">{{ title }}</a></h3>
        <p class="story-row__excerpt">{{ excerpt }}</p>
    </div>
</article>
