<!-- Site banner component - Displays a page's banner image with overlaid title/subtitle. Reusable across all pages. -->
<header class="banner-header">
    <div class="banner" style="background-image: url('{{ banner_image|default(site.default_banner_image, true) }}');">
        <div>
            <h1>{{ banner_title|default(site.title, true) }}</h1>
            <p>{{ banner_subtitle|default(site.subtitle, true) }}</p>
        </div>
    </div>
</header>
